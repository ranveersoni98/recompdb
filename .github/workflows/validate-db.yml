name: Validate database entries

on:
  pull_request:
    paths:
      - "db/*.json"
      - ".github/schemas/db-entry.schema.json"
      - ".github/workflows/validate-db.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Check JSON entries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install JSON Schema validator
        run: python -m pip install check-jsonschema==0.39.0
      - name: Validate entries against schema
        run: check-jsonschema --schemafile .github/schemas/db-entry.schema.json db/*.json
